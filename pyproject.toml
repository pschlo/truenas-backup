[project]
name = "truenas-backup"
version = "0.1.4"
description = "Backup TrueNAS SCALE configuration via the JSON-RPC WebSocket API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.8.0",
]

[project.scripts]
truenas-backup = "truenas_backup.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12"]
build-backend = "uv_build"
